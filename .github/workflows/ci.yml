name: CI for pre-deployment

on:
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      frontend_ci: ${{ steps.detect.outputs.frontend_ci }}
      episode_data: ${{ steps.detect.outputs.episode_data }}

    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # frontend配下とエピソードJSONの変更を検出し、後続jobの実行可否を判定する。
      - name: Detect application changes
        id: detect
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          if git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- frontend; then
            echo "frontend_ci=false" >> "$GITHUB_OUTPUT"
          else
            echo "frontend_ci=true" >> "$GITHUB_OUTPUT"
          fi

          if git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- data/episode_data.json; then
            echo "episode_data=false" >> "$GITHUB_OUTPUT"
          else
            echo "episode_data=true" >> "$GITHUB_OUTPUT"
          fi

  lint:
    name: Run lint workflow
    needs: changes
    if: needs.changes.outputs.frontend_ci == 'true'
    uses: ./.github/workflows/_lint.yml

  test:
    name: Run test workflow
    needs: changes
    if: |
      needs.changes.outputs.frontend_ci == 'true' ||
      needs.changes.outputs.episode_data == 'true'
    uses: ./.github/workflows/_test.yml
    with:
      should_run_unit: ${{ needs.changes.outputs.frontend_ci == 'true' }}
      should_run_e2e: ${{ needs.changes.outputs.frontend_ci == 'true' || needs.changes.outputs.episode_data == 'true' }}

  ci-gate:
    name: CI Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    if: always()
    needs:
      - changes
      - lint
      - test

    steps:
      - name: Validate CI results
        env:
          FRONTEND_CI_REQUIRED: ${{ needs.changes.outputs.frontend_ci }}
          EPISODE_DATA_CHANGED: ${{ needs.changes.outputs.episode_data }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "Change detection failed."
            exit 1
          fi

          if [ "$FRONTEND_CI_REQUIRED" != "true" ] && [ "$EPISODE_DATA_CHANGED" != "true" ]; then
            echo "Application CI is not required for this change."
            exit 0
          fi

          if [ "$FRONTEND_CI_REQUIRED" = "true" ] && [ "$LINT_RESULT" != "success" ]; then
            echo "Required lint workflow failed or did not complete successfully."
            exit 1
          fi

          if [ "$TEST_RESULT" != "success" ]; then
            echo "Required test workflow failed or did not complete successfully."
            exit 1
          fi

          echo "All required application CI completed successfully."
